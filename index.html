
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Admission Prep BD – Physics, Chemistry, Math</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--bd:#e3e6ee;--ac:#2563eb;--ph:#7c3aed;--ch:#059669;--ma:#d97706}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mu:#9aa3b5;--bd:#2c3342;--ac:#6b9bff}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mu:#9aa3b5;--bd:#2c3342;--ac:#6b9bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}.sub{color:var(--mu);margin:0 0 14px}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
nav button,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;color:#fff;margin-right:6px}
.Physics{background:var(--ph)}.Chemistry{background:var(--ch)}.Math{background:var(--ma)}
.meta{color:var(--mu);font-size:13px}.pre{white-space:pre-wrap;word-break:break-word}
details{margin-top:6px}summary{cursor:pointer;color:var(--ac)}
.note{font-size:13px;color:var(--mu);border-left:3px solid var(--bd);padding-left:10px;margin:10px 0}
.hide{display:none}.empty{text-align:center;color:var(--mu);padding:28px}
</style></head><body><div class="w">
<h1>🎓 Admission Prep BD</h1>
<p class="sub">Free question bank, student tactics &amp; AI tutor — Physics · Chemistry · Math (BUET / Engineering admission)</p>
<nav id="nav"></nav>

<section id="p-q">
  <div class="card"><div class="row" id="sf"></div>
    <div class="row"><input id="qs" placeholder="Search questions or chapter…"></div></div>
  <details class="card" id="qadd"><summary>➕ Upload a question</summary><div style="margin-top:10px">
    <div class="row"><select id="qsub"><option>Physics</option><option>Chemistry</option><option>Math</option></select>
    <input id="qch" placeholder="Chapter (e.g. Waves, Organic, Calculus)"><input id="qsrc" placeholder="Source (e.g. BUET 2022)"></div>
    <textarea id="qtx" placeholder="Question text (options included if MCQ)"></textarea>
    <textarea id="qan" placeholder="Answer / solution (optional)"></textarea>
    <button class="btn" id="qgo">Post question</button></div></details>
  <div id="ql"></div>
</section>

<section id="p-t" class="hide">
  <div class="card"><div class="row" id="tf"></div></div>
  <details class="card" id="tadd"><summary>💡 Share your tactic</summary><div style="margin-top:10px">
    <div class="row"><select id="tsub"><option>Physics</option><option>Chemistry</option><option>Math</option></select>
    <input id="tti" placeholder="Title (e.g. Shortcut for projectile range)"></div>
    <textarea id="tbd" placeholder="Explain your trick or study method so others can use it"></textarea>
    <button class="btn" id="tgo">Share tactic</button></div></details>
  <div id="tl"></div>
</section>

<section id="p-a" class="hide">
  <div class="card"><b>🤖 Free AI tutor</b>
    <p class="meta">Paste any question. It explains step by step. Answers can be wrong — always double-check.</p>
    <select id="alang"><option value="English">Reply in English</option><option value="Bengali (বাংলা), keeping formulas and technical terms in English">উত্তর বাংলায়</option></select>
    <textarea id="aq" placeholder="Type or paste a Physics / Chemistry / Math question…"></textarea>
    <button class="btn" id="ago">Explain step by step</button>
    <div id="aout" class="pre" style="margin-top:12px"></div></div>
</section>
<p class="note" id="mode"></p>
</div>
<script>
const $=id=>document.getElementById(id), SUBS=["Physics","Chemistry","Math"];
let db=null,uid="anon",S={q:[],t:[]},F={q:"All",t:"All"},unsub=[];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// ---- navigation
const tabs=[["q","📚 Questions"],["t","💡 Tactics"],["a","🤖 AI Tutor"]];
function show(k){tabs.forEach(([x])=>{$("p-"+x).classList.toggle("hide",x!==k)});[...$("nav").children].forEach((b,i)=>b.classList.toggle("on",tabs[i][0]===k))}
tabs.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>show(k);$("nav").appendChild(b)});show("q");
// ---- subject filters
["q","t"].forEach(k=>{const box=$(k+"f");["All",...SUBS].forEach(s=>{const b=document.createElement("button");b.className="chip"+(s==="All"?" on":"");b.textContent=s;b.style.flex="0 0 auto";b.onclick=()=>{F[k]=s;[...box.children].forEach(c=>c.classList.toggle("on",c===b));render()};box.appendChild(b)})});
$("qs").oninput=render;
// ---- data layer (shared db when available, else this browser only)
async function save(col,id,obj){
  if(db){try{await db.collection(col).doc(id).set(obj);return}catch(e){}}
  const a=ls.get(col).filter(x=>x.id!==id);a.push({...obj,id});ls.set(col,a);S[col==="questions"?"q":"t"]=a;render();
}
function listen(col,key){
  if(db){try{unsub.push(db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(d=>({...d.data(),id:d.id}));render()}));return}catch(e){}}
  S[key]=ls.get(col);
}
async function init(){
  try{const c=window.claude;if(c){db=await c.use("db");const u=await c.use("user");if(u&&u.id)uid=(await u.id())||"anon"}}catch(e){db=null}
  listen("questions","q");listen("tactics","t");render();
  $("mode").textContent=db?"Live mode: posts are shared with everyone who can open this page.":"Offline mode: posts are saved only in this browser. See the hosting guide to make it public.";
}
// ---- render
const when=t=>new Date(t||0).toLocaleDateString();
function render(){
  const q=$("qs").value.toLowerCase();
  const qs=S.q.filter(x=>(F.q==="All"||x.sub===F.q)&&(!q||(x.text+x.ch+x.src).toLowerCase().includes(q))).sort((a,b)=>(b.at||0)-(a.at||0));
  $("ql").innerHTML=qs.length?qs.map(x=>`<div class="card"><span class="tag ${esc(x.sub)}">${esc(x.sub)}</span><span class="meta">${esc(x.ch)} ${x.src?"· "+esc(x.src):""} · ${when(x.at)}</span>
  <div class="pre" style="margin-top:8px">${esc(x.text)}</div>
  ${x.ans?`<details><summary>Show answer / solution</summary><div class="pre">${esc(x.ans)}</div></details>`:""}
  <button class="btn g" style="margin-top:8px" data-ai="${esc(x.id)}">🤖 Ask AI</button></div>`).join(""):'<div class="empty">No questions yet. Be the first to upload one!</div>';
  const ts=S.t.filter(x=>F.t==="All"||x.sub===F.t).sort((a,b)=>(b.votes?.length||0)-(a.votes?.length||0)||(b.at||0)-(a.at||0));
  $("tl").innerHTML=ts.length?ts.map(x=>`<div class="card"><span class="tag ${esc(x.sub)}">${esc(x.sub)}</span><b>${esc(x.title)}</b>
  <div class="pre" style="margin:8px 0">${esc(x.body)}</div>
  <button class="btn g" data-vote="${esc(x.id)}">👍 ${x.votes?.length||0}</button> <span class="meta">${when(x.at)}</span></div>`).join(""):'<div class="empty">No tactics yet. Share the trick that worked for you.</div>';
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-ai]");if(a){const x=S.q.find(z=>z.id===a.dataset.ai);if(x){$("aq").value=x.text;show("a");$("aq").scrollIntoView()}}
  const v=e.target.closest("[data-vote]");if(v){const x=S.t.find(z=>z.id===v.dataset.vote);if(!x)return;const vs=x.votes||[];if(vs.includes(uid))return;save("tactics",x.id,{...x,votes:[...vs,uid]})}
});
const uidgen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
$("qgo").onclick=async()=>{const text=$("qtx").value.trim();if(!text)return;
  await save("questions",uidgen(),{sub:$("qsub").value,ch:$("qch").value.trim(),src:$("qsrc").value.trim(),text,ans:$("qan").value.trim(),at:Date.now(),by:uid});
  ["qtx","qan","qch","qsrc"].forEach(i=>$(i).value="");$("qadd").open=false};
$("tgo").onclick=async()=>{const title=$("tti").value.trim(),body=$("tbd").value.trim();if(!title||!body)return;
  await save("tactics",uidgen(),{sub:$("tsub").value,title,body,votes:[],at:Date.now(),by:uid});
  $("tti").value=$("tbd").value="";$("tadd").open=false};
// ---- AI tutor
$("ago").onclick=async()=>{
  const q=$("aq").value.trim(),out=$("aout");if(!q)return;
  let sample=null;try{sample=window.claude&&await window.claude.use("sample")}catch(e){}
  if(!sample){out.textContent="AI is not available in this view.";return}
  out.textContent="Thinking…";
  const prompt=`You are a patient tutor for Bangladeshi engineering admission (BUET/CKRUET/etc.) in Physics, Chemistry and Math. Solve the question step by step, state formulas used, give the final answer clearly, then add one short exam-speed shortcut if one exists. Plain text only, no markdown tables. Language: ${$("alang").value}.\n\nQuestion:\n${q}`;
  try{await sample(prompt,{cache:false,onText:({text})=>{out.textContent=text}})}
  catch(e){out.textContent=e&&e.code==="rate_limited"?"Too many requests. Wait a moment and try again.":"AI could not answer right now."}
};
init();
</script></body></html>
